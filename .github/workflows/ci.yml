name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build RoboCopyTo.sln -c Release
      - name: Test (timing-sensitive cancel test skipped on CI)
        run: dotnet test RoboCopyTo.sln -c Release --no-build --filter "FullyQualifiedName!~Cancel_stops_robocopy_within_two_seconds"
